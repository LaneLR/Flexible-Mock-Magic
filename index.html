<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <nav class="navbar">
      <div>
        <a href="https://www.multiverse.io/en-US" class="logo">
          <img
            src="https://cdn-icons-png.flaticon.com/512/268/268998.png"
            alt="coding"
          />
        </a>
      </div>

      <ul class="nav-links">
        <li class="nav-item"><a href="#">Home</a></li>
        <li class="nav-item"><a href="#">Forum</a></li>
        <li class="nav-item"><a href="#">News</a></li>
        <li class="nav-item"><a href="#">Sign in</a></li>
      </ul>
    </nav>

    <main class="flex-main">
      <div class="sidebar">
        <p>Messages</p>
        <p>Music</p>
        <p>Blog</p>
        <p>More Info</p>
      </div>
      <div class="main-content">
        <div class="image-container">
          Squirtle<img src="images/squirtle.jpg" alt="squirtle" />
        </div>
        <div class="image-container flex-grow">
          Whooper<img src="images/wooper.jpg" alt="Whooper" />
        </div>
        <div class="image-container">
          Gyarados<img src="images/gyarados.jpg" alt="Gyarados" />
        </div>
        <div class="image-container">
          Poliwag<img src="images/poliwag.jpg" alt="Poliwag" />
        </div>
        <div class="image-container flex-grow">
          Wartortle<img src="images/wartortle.jpg" alt="Wartortle" />
        </div>
        <div class="image-container">
          Psyduck<img src="images/psyduck.jpg" alt="Psyduck" />
        </div>
        <div class="image-container">
          Piplup<img src="images/piplup.jpg" alt="Piplup" />
        </div>
        <div class="image-container flex-grow">
          Totodile<img src="images/totodile.jpg" alt="Totodile" />
        </div>
        <div class="image-container">
          Magikarp<img src="images/magikarp.jpg" alt="Margikarp" />
        </div>
      </div>
    </main>

    <footer>
      <img src="/images/facebook.svg" alt="facebook" />
      <img src="/images/twitter.svg" alt="twitter" />
      <img src="/images/instagram.svg" alt="instagram" />
      <img src="/images/tiktok.svg" alt="tik tok" />
      <img src="/images/youtube.svg" alt="youtube" />
    </footer>
  </body>
</html>
